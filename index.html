<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>人狼ゲーム（タブレット用）</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    background: #111;
    color: white;
}
.hidden { display: none; }
input, button {
    font-size: 18px;
    padding: 8px;
    margin: 5px;
}
.box {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    margin: 20px;
}
</style>
</head>
<body>

<h1>人狼ゲーム</h1>

<div id="screen" class="box"></div>

<script>
// ====== 状態 ======
let roles = {};          // {役職名: 人数}
let roleList = [];       // シャッフル済み役職配列
let names = [];          // 参加者名
let index = 0;           // 現在の人
let step = 0;

// ====== 初期画面 ======
showRoleInput();

// ====== 画面関数 ======
function setScreen(html) {
    document.getElementById("screen").innerHTML = html;
}

// ====== ① 役職入力 ======
function showRoleInput() {
    setScreen(`
        <h2>使用する役職を入力</h2>
        <p>例：人狼,狂人,占い師,騎士,市民</p>
        <input id="roleInput" placeholder="カンマ区切り">
        <br>
        <button onclick="setRoleCounts()">次へ</button>
    `);
}

function setRoleCounts() {
    const input = document.getElementById("roleInput").value;
    const roleNames = input.split(",").map(r => r.trim()).filter(r => r);
    if (roleNames.length === 0) return;

    let html = `<h2>役職の人数を入力</h2>`;
    roleNames.forEach(r => {
        html += `
            <p>${r}</p>
            <input type="number" min="0" id="count_${r}">
        `;
    });
    html += `<br><button onclick="confirmRoles()">次へ</button>`;
    setScreen(html);
}

function confirmRoles() {
    roles = {};
    roleList = [];

    for (let key of document.querySelectorAll("input[type=number]")) {
        const role = key.id.replace("count_", "");
        const count = Number(key.value);
        if (count > 0) {
            roles[role] = count;
            for (let i = 0; i < count; i++) roleList.push(role);
        }
    }
    shuffle(roleList);
    showNameInput();
}

// ====== ② 名前入力 ======
function showNameInput() {
    setScreen(`
        <h2>参加者の名前を入力</h2>
        <p>1人ずつ Enter</p>
        <input id="nameInput">
        <br>
        <button onclick="addName()">追加</button>
        <button onclick="startGame()">開始</button>
        <ul id="nameList"></ul>
    `);
}

function addName() {
    const n = document.getElementById("nameInput").value.trim();
    if (!n) return;
    names.push(n);
    document.getElementById("nameInput").value = "";
    updateNameList();
}

function updateNameList() {
    document.getElementById("nameList").innerHTML =
        names.map(n => `<li>${n}</li>`).join("");
}

function startGame() {
    if (names.length !== roleList.length) {
        alert("人数と役職数が一致しません");
        return;
    }
    index = 0;
    step = 0;
    nextPerson();
}

// ====== ③ 役職配布 ======
function nextPerson() {
    setScreen(`
        <h2>次の人は</h2>
        <h1>${names[index]} さん</h1>
        <p>本人にタブレットを渡してください</p>
        <button onclick="showConfirm()">確認する</button>
    `);
}

function showConfirm() {
    setScreen(`
        <h2>本人確認</h2>
        <p>あなたの名前を入力してください</p>
        <input id="checkName">
        <br>
        <button onclick="showRole()">確認</button>
    `);
}

function showRole() {
    const input = document.getElementById("checkName").value.trim();
    if (input !== names[index]) {
        alert("名前が一致しません");
        return;
    }

    setScreen(`
        <h2>${names[index]} さんの役職</h2>
        <h1>${roleList[index]}</h1>
        <p>確認したら次の人へ</p>
        <button onclick="finishRole()">次へ</button>
    `);
}

function finishRole() {
    index++;
    if (index >= names.length) {
        setScreen("<h2>全員の役職配布が完了しました</h2>");
    } else {
        nextPerson();
    }
}

// ====== シャッフル ======
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}
</script>

</body>
</html>
